name: Windows build and functional tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Test, build and exercise packaged worker
        shell: powershell
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CADLightCleaner-Windows
          path: dist/CADLightCleaner-Windows.zip
          if-no-files-found: error
